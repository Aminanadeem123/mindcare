<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Dashboard - MindCare Hub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/premium-theme.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght=300;400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/doctor-dashboard.css">

    <link rel="stylesheet" href="css/component.css">
</head>
<body class="theme-calm">
<div class="mc-mouse-glow" data-mouse-glow aria-hidden="true"></div>
<div class="bg-blob-1"></div><div class="bg-blob-2"></div>
<div class="main-content">

<!-- Navbar injected by component.js -->

<div class="container mt-4 mb-2 text-center">
    <h1 class="fw-800"><span class="text-gradient">Doctor Dashboard</span> ??</h1>
    <p class="text-muted">Sab patients ki reports, prescribed activities aur parent submissions ek jagah.</p>
</div>

<!-- STATS ROW -->
<div class="container mb-4">
    <div class="row g-3">
        <div class="col-6 col-md-3"><div class="stat-box"><div class="stat-num" id="totalPrescriptions">0</div><div class="stat-lbl">Total Prescriptions</div></div></div>
        <div class="col-6 col-md-3"><div class="stat-box"><div class="stat-num" id="totalParentReports">0</div><div class="stat-lbl">Parent Reports</div></div></div>
        <div class="col-6 col-md-3"><div class="stat-box"><div class="stat-num" id="uniquePatients">0</div><div class="stat-lbl">Unique Patients</div></div></div>
        <div class="col-6 col-md-3"><div class="stat-box"><div class="stat-num" id="todayCount">0</div><div class="stat-lbl">Today's Entries</div></div></div>
    </div>
</div>

<!-- TABS -->
<div class="container mb-4">
    <div class="d-flex flex-wrap gap-2 justify-content-center">
        <button class="tab-pill active" onclick="switchTab('prescriptions',this)"><i class="bi bi-clipboard2-pulse me-1"></i> Patient Prescriptions</button>
        <button class="tab-pill" onclick="switchTab('parentreports',this)"><i class="bi bi-people me-1"></i> Parent Reports</button>
        <button class="tab-pill" onclick="switchTab('moodlogs',this)"><i class="bi bi-graph-up me-1"></i> Mood Logs</button>
    </div>
</div>

<div class="container mb-5">

    <!-- PRESCRIPTIONS TAB -->
    <div id="tab-prescriptions" class="tab-content-pane active">
        <div class="glass">
            <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
                <h5 class="fw-bold mb-0"><i class="bi bi-clipboard2-heart me-2" style="color:var(--accent-teal)"></i> Prescribed Activity Reports</h5>
                <button class="btn-danger-soft" onclick="clearPrescriptions()"><i class="bi bi-trash me-1"></i> Sab Clear Karein</button>
            </div>
            <div id="prescriptionsList"></div>
        </div>
    </div>

    <!-- PARENT REPORTS TAB -->
    <div id="tab-parentreports" class="tab-content-pane">
        <div class="glass">
            <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
                <h5 class="fw-bold mb-0"><i class="bi bi-person-heart me-2" style="color:var(--accent-teal)"></i> Parent Submitted Reports</h5>
                <button class="btn-danger-soft" onclick="clearParentReports()"><i class="bi bi-trash me-1"></i> Sab Clear Karein</button>
            </div>
            <div id="parentReportsList"></div>
        </div>
    </div>

    <!-- MOOD LOGS TAB -->
    <div id="tab-moodlogs" class="tab-content-pane">
        <div class="glass">
            <h5 class="fw-bold mb-4"><i class="bi bi-emoji-smile me-2" style="color:var(--accent-teal)"></i> Patient Mood Tracker Logs</h5>
            <div id="moodLogsList"></div>
        </div>
    </div>

</div>
</div>

<!-- Footer injected by component.js -->

<script src="js/doctor-dashboard.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/common.js"></script>
<script src="js/component.js"></script>
</body>
</html>
